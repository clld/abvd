[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abvd"
version = "1.0.0"
description = "clld app serving the ABVD."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Robert Forkel", email = "dlce.rdm@eva.mpg.de"}
]
keywords = ["web", "pyramid", "clld"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "clld>=12.0",
    "clldmpg>=4.5",
    "clld-cognacy-plugin>=2.0",
    "clld-glottologfamily-plugin>=5.0",
    "sqlalchemy",
    "psycopg2",
]

[project.urls]
Homepage = "https://github.com/clld/abvd"

[project.optional-dependencies]
initdb = [
    "clld-glottologfamily-plugin[initdb]",
    "nameparser>=2.0",
]
dev = [
    "clld[dev]",
]
test = [
    "pytest>=5",
    "pytest-clld>=1.0.3",
    "pytest-mock",
    "pytest-cov",
    "coverage>=4.2",
    "selenium",
    "zope.component>=3.11.0",
]

[project.entry-points."paste.app_factory"]
main = "abvd:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
abvd = [
    "locale/**",
    "templates/**/*",
    "static/**",
]

[tool.babel]

[[tool.babel.mappings]]
method = "ignore"
pattern = ["static/**"]

[[tool.babel.mappings]]
method = "python"
pattern = "**.py"

[[tool.babel.mappings]]
method = "mako"
pattern = "**.mako"
encoding = "utf8"

[tool.ruff]
line-length = 100
exclude = [".tox"]

[tool.ruff.lint]
# E/F match default Flake8; D enables pydocstyle checks (since you ignored specific D rules)
select = ["E", "F", "D"]
ignore = [
    "E711", # Comparison to `None` should be `cond is None` (needed for SQLAlchemy filters)
    "E712", # Comparison to `True` should be `cond is True` (needed for SQLAlchemy filters)
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104",
    "D105",
    "D107",
    "D301", # Use `r"""` if any backslashes in a docstring
    "D203",
    "D205",
    "D211",
    "D212",
    "D213",
    "D400",
    "D401",
    "D403",
    "D404",
    "D415",
    "D419",
    "E722",
]

[tool.pytest.ini_options]
minversion = "5.0"
testpaths = ["tests"]
addopts = [
    "--cov",
]
filterwarnings = [
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::sqlalchemy.exc.RemovedIn20Warning",
]
markers = ["selenium: webtest using selenium"]

[tool.coverage.run]
source = [
    "abvd",
    "tests",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
